<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lug'atlar - Language Learning App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-book"></i> Lug'atlar</h1>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="So'z qidirish...">
                    <i class="fas fa-search"></i>
                </div>
            </div>
        </header>

        <main class="dictionary-container">
            <div class="categories">
                <div class="category-card active" data-category="all">
                    <i class="fas fa-th-large"></i>
                    <span>Barchasi</span>
                </div>
                <div class="category-card" data-category="verbs">
                    <i class="fas fa-running"></i>
                    <span>Fe'llar</span>
                </div>
                <div class="category-card" data-category="nouns">
                    <i class="fas fa-cube"></i>
                    <span>Otlar</span>
                </div>
                <div class="category-card" data-category="adjectives">
                    <i class="fas fa-palette"></i>
                    <span>Sifatlar</span>
                </div>
                <div class="category-card" data-category="phrases">
                    <i class="fas fa-comments"></i>
                    <span>Gap bo'laklari</span>
                </div>
            </div>

            <div class="words-grid">
                <!-- So'zlar JavaScript orqali qo'shiladi -->
            </div>

            <div class="add-word-btn">
                <i class="fas fa-plus"></i>
                <span>Yangi so'z qo'shish</span>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Bosh sahifa</span>
            </a>
            <a href="dictionary.html" class="nav-item active">
                <i class="fas fa-book"></i>
                <span>Lug'atlar</span>
            </a>
            <a href="stats.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistika</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Profil</span>
            </a>
        </nav>
    </div>

    <!-- Yangi so'z qo'shish modali -->
    <div class="modal" id="add-word-modal">
        <div class="modal-content">
            <h2>Yangi so'z qo'shish</h2>
            <form id="add-word-form">
                <div class="form-group">
                    <label>So'z</label>
                    <input type="text" id="word-input" required>
                </div>
                <div class="form-group">
                    <label>Tarjimasi</label>
                    <input type="text" id="translation-input" required>
                </div>
                <div class="form-group">
                    <label>Kategoriya</label>
                    <select id="category-input" required>
                        <option value="verbs">Fe'l</option>
                        <option value="nouns">Ot</option>
                        <option value="adjectives">Sifat</option>
                        <option value="phrases">Gap bo'lagi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Misol</label>
                    <textarea id="example-input"></textarea>
                </div>
                <div class="button-group">
                    <button type="button" class="btn cancel-btn">Bekor qilish</button>
                    <button type="submit" class="btn save-btn">Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <script src="dictionary.js"></script>
</body>
</html>
