<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Language Learning App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-question-circle"></i> Test</h1>
                <div class="quiz-stats">
                    <div class="stat-item">
                        <i class="fas fa-clock"></i>
                        <span id="timer">30</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-star"></i>
                        <span id="score">0</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="quiz-container">
            <div class="quiz-types">
                <div class="type-card active" data-type="multiple-choice">
                    <i class="fas fa-list"></i>
                    <span>Ko'p tanlovli</span>
                </div>
                <div class="type-card" data-type="translation">
                    <i class="fas fa-language"></i>
                    <span>Tarjima</span>
                </div>
                <div class="type-card" data-type="listening">
                    <i class="fas fa-headphones"></i>
                    <span>Tinglab yozish</span>
                </div>
            </div>

            <div class="quiz-section">
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-number">Savol 1/10</span>
                        <span class="question-type">Ko'p tanlovli</span>
                    </div>
                    
                    <div class="question-content">
                        <h2 id="question-text">Loading...</h2>
                        <div class="options" id="options-container">
                            <!-- Variantlar JavaScript orqali qo'shiladi -->
                        </div>
                    </div>

                    <div class="question-footer">
                        <button class="hint-btn" id="hint-btn">
                            <i class="fas fa-lightbulb"></i>
                            Maslahat
                        </button>
                        <button class="next-btn" id="next-btn">
                            Keyingi
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress" id="quiz-progress"></div>
                    </div>
                    <span id="progress-text">0%</span>
                </div>
            </div>
        </main>

        <!-- Test yakunlangan modali -->
        <div class="modal" id="result-modal">
            <div class="modal-content">
                <h2>Test yakunlandi!</h2>
                <div class="result-stats">
                    <div class="stat">
                        <i class="fas fa-check-circle"></i>
                        <span id="correct-answers">0</span>
                        <p>To'g'ri javoblar</p>
                    </div>
                    <div class="stat">
                        <i class="fas fa-clock"></i>
                        <span id="time-taken">0</span>
                        <p>Sarflangan vaqt</p>
                    </div>
                    <div class="stat">
                        <i class="fas fa-star"></i>
                        <span id="final-score">0</span>
                        <p>Ball</p>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn" id="review-btn">
                        <i class="fas fa-redo"></i>
                        Qayta ko'rish
                    </button>
                    <button class="btn" id="restart-btn">
                        <i class="fas fa-play"></i>
                        Qaytadan boshlash
                    </button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Bosh sahifa</span>
            </a>
            <a href="dictionary.html" class="nav-item">
                <i class="fas fa-book"></i>
                <span>Lug'atlar</span>
            </a>
            <a href="stats.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistika</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Profil</span>
            </a>
        </nav>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
